worker_processes auto;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    # least_conn sends new connections to whichever gateway replica has the
    # fewest active connections — better than round-robin here because
    # request latency is variable (cache hit vs. cache miss vs. batch wait).
    upstream gateway_backend {
        least_conn;
        server gateway-1:8000 max_fails=3 fail_timeout=5s;
        server gateway-2:8000 max_fails=3 fail_timeout=5s;
        server gateway-3:8000 max_fails=3 fail_timeout=5s;
        keepalive 256;
    }

    access_log off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    server {
        listen 80;

        location /health {
            proxy_pass http://gateway_backend/health;
        }

        location / {
            proxy_pass http://gateway_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";       # enable keepalive to upstream
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Ingestion itself is instant; the model call behind it can take
            # up to RESULT_WAIT_TIMEOUT_S, so give the upstream room to answer.
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;

            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}
