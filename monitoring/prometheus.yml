global:
  scrape_interval: 2s

scrape_configs:
  - job_name: "gateway"
    static_configs:
      - targets:
          - "gateway-1:8000"
          - "gateway-2:8000"
          - "gateway-3:8000"

  - job_name: "worker"
    static_configs:
      - targets:
          - "worker-1:9100"
          - "worker-2:9100"
