# docker-compose.yml
version: "3.8"
services:
  inference-service:
    build: .
    ports: ["8000:8000"]
    environment:
      - MAX_BATCH_SIZE=16
      - BATCH_TIMEOUT_MS=10

  prometheus:
    image: prom/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana
    ports: ["3000:3000"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin